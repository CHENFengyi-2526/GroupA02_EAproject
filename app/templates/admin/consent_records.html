{% extends "base.html.j2" %}
{% block title %}Consent Records - Admin{% endblock %}
{% block content %}
<div class="container my-4">
    <h2 class="mb-4">Consent Records</h2>
    <table class="table table-striped">
        <thead>
            <tr><th>ID</th><th>User ID</th><th>Type</th><th>Status</th><th>Signed At</th></tr>
        </thead>
        <tbody>
            {% for r in records %}
            <tr>
                <td>{{ r.id }}</td>
                <td>{{ r.user_id }}</td>
                <td>{{ r.consent_type }}</td>
                <td>{{ r.consent_status }}</td>
                <td>{{ r.signed_at }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
